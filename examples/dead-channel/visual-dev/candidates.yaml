sets:
  - {asset_id: sera-face-v1, brief: visual-dev/sera.yaml, target: neutral-headshot, candidates: []}
  - {asset_id: sera-workwear-v1, brief: visual-dev/sera.yaml, target: full-body-front, candidates: []}
  - {asset_id: sera-turnaround-v1, brief: visual-dev/sera.yaml, target: turnaround, depends_on: [sera-face-v1, sera-workwear-v1], candidates: []}
  - {asset_id: kestrel-exterior-v1, brief: visual-dev/kestrel.yaml, target: exterior-hero-wide, candidates: []}
  - {asset_id: kestrel-room-a-v1, brief: visual-dev/kestrel.yaml, target: listening-room-angle-a, candidates: []}
  - {asset_id: kestrel-floorplan-v1, brief: visual-dev/kestrel.yaml, target: floorplan, candidates: []}
  - {asset_id: receiver-hero-v1, brief: visual-dev/props.yaml, target: receiver-three-quarter, candidates: []}
  - {asset_id: console-hero-v1, brief: visual-dev/props.yaml, target: console-three-quarter, candidates: []}
  - {asset_id: ui-kit-v1, target: deterministic-design, generation: prohibited, candidates: []}
approval_record:
  fields: [candidate_id, asset_id, artifact_path, sha256, reviewer, decision, rationale, approved_at]
